name: Build iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify chess rules
        run: swiftc ChessChild/Chess.swift Tests/main.swift -o /tmp/chesschild-rules && /tmp/chesschild-rules
      - name: Build for iPad
        run: |
          xcodebuild \
            -project ChessChild.xcodeproj \
            -scheme ChessChild \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ChessChildBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/ChessChildBuild/Build/Products/Release-iphoneos/ChessChild.app" Payload/
          zip -qry ChessChild-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ChessChild-iPad-IPA
          path: ChessChild-unsigned.ipa
          if-no-files-found: error
